#:schema ../tools/cargo-with-detailed-deps.json
lints.workspace = true

[package]
edition = "2024"
name = "nativelink-fetch"
version = "1.8.0"

[dependencies]
nativelink-config = { path = "../nativelink-config" }
nativelink-error = { path = "../nativelink-error" }
nativelink-proto = { path = "../nativelink-proto" }
nativelink-store = { path = "../nativelink-store" }
nativelink-util = { path = "../nativelink-util" }

astral-tokio-tar = { version = "0.7.0", default-features = false }
async-compression = { version = "0.4.51", default-features = false, features = [
  "deflate",
  "gzip",
  "tokio",
] }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
bytes = { version = "1.10.1", default-features = false }
crc32fast = { version = "1.4.2", default-features = false, features = ["std"] }
futures = { version = "0.3.31", default-features = false }
parking_lot = { version = "0.12.3", default-features = false }
prost = { version = "0.14.4", default-features = false }
prost-types = { version = "0.14.4", default-features = false, features = [
  "std",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "stream",
] }
rustls = { version = "0.23.27", default-features = false, features = ["ring"] }
sha1 = { version = "0.10.6", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
tempfile = { version = "3.8.1", default-features = false }
tokio = { version = "1.52.2", features = [
  "fs",
  "io-util",
  "rt-multi-thread",
  "sync",
  "time",
], default-features = false }
tokio-util = { version = "0.7.14", default-features = false, features = ["io"] }
tonic = { version = "0.14.0", features = [
  "gzip",
  "router",
  "tls-ring",
  "transport",
], default-features = false }
tracing = { version = "0.1.41", default-features = false }
zip = { version = "9.0.0", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }

[dev-dependencies]
nativelink-macro = { path = "../nativelink-macro" }

flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
pretty_assertions = { version = "1.4.1", features = [
  "std",
], default-features = false }
tar = { version = "0.4.44", default-features = false }
tokio = { version = "1.52.2", features = [
  "net",
  "test-util",
], default-features = false }
tracing-test = { version = "0.2.5", default-features = false, features = [
  "no-env-filter",
] }

[package.metadata.cargo-machete]
# Used by nativelink_test macro
ignored = ["tracing-test"]
